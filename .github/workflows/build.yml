name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore + build
        run: dotnet build ExcelConsole.csproj --nologo
      - name: Headless tests
        run: bash tests/run.sh
